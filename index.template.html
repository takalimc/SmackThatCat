<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Smack That Cat! v0.6.5</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#261522;font-family:system-ui,-apple-system,sans-serif;color:white}button{cursor:pointer;font:inherit;touch-action:manipulation}#app{position:relative;max-width:650px;height:100dvh;margin:auto;overflow:hidden;background:radial-gradient(circle,#fff5da,#f7bcb3)}.hidden{display:none!important}#home,#game,#cinema,#end,#help,#paused{position:absolute;inset:0}#home{background:#35221e}#poster{width:100%;height:100%;object-fit:cover}#home:after{content:"";position:absolute;inset:65% 0 0;background:linear-gradient(transparent,#24111ad9);pointer-events:none}#menu{position:absolute;bottom:max(5%,env(safe-area-inset-bottom));left:0;right:0;z-index:2;display:grid;justify-items:center;gap:12px}.primary{border:4px solid #fff3d8;border-radius:50px;background:linear-gradient(#ff7286,#e72452);color:white;font-size:27px;font-weight:1000;padding:12px 58px;box-shadow:0 6px #92203c}.secondary{border:2px solid #a34a5a;border-radius:40px;background:#fff3dd;color:#692d43;font-weight:800;padding:10px 25px}#hud{position:absolute;z-index:5;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:5px}.pill{min-width:73px;text-align:center;border-radius:13px;border:2px solid #ffdb95;background:#6b3041;padding:5px 8px;font-size:11px;font-weight:900}.pill strong{display:block;font-size:25px;color:#ffe57a}#tools{display:flex;gap:5px}#tools button{border:2px solid #fff6;border-radius:10px;background:#fff3df;color:#763145;height:43px;min-width:39px}#phase{position:absolute;top:85px;left:6px;right:6px;text-align:center;color:#922b50;font-size:clamp(18px,5vw,26px);font-weight:1000}#arena{position:absolute;inset:145px 8px 105px;overflow:hidden;touch-action:none}#target{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(120px,39vw,240px);height:clamp(120px,39vw,240px);border:0;background:none;padding:0;touch-action:none;transition:left .13s ease-out,top .13s ease-out}#target img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}#target.boss{width:min(65%,260px);height:min(80%,380px)}#target.hit img{animation:boop .16s ease}@keyframes boop{50%{transform:scale(.89) rotate(-5deg)}}#bubble{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:clamp(17px,4.2vw,23px);color:#e92859;font-weight:1000;text-shadow:1px 2px white;pointer-events:none}#progress{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:4px;right:4px;text-align:center;color:#782c43;font-weight:900;font-size:13px}#slots{display:flex;justify-content:center;gap:5px;margin-top:7px}.slot{width:clamp(37px,11vw,54px);height:clamp(37px,11vw,54px);border:2px solid #ce8793;border-radius:10px;background:#fff9}.slot img{width:100%;height:100%;object-fit:contain}#cinema{z-index:12;background:#21151e;display:flex;flex-direction:column;align-items:stretch;justify-content:center;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}#cinema img{width:100%;height:calc(100% - 96px);min-height:0;object-fit:contain;flex:1}#cinemaLabel{position:relative;flex:none;min-height:90px;padding:12px 16px;display:grid;place-items:center;text-align:center;font-weight:1000;font-size:clamp(18px,4.8vw,29px);line-height:1.12;color:#ffe46c;text-shadow:2px 3px #842441;background:#21151e}#end,#help,#paused{z-index:20;background:#271524e9;display:grid;place-items:center;padding:18px}.panel{background:#fff1d9;border:4px solid #f6bb61;border-radius:23px;color:#702d43;padding:23px;max-width:440px;width:100%;text-align:center}.panel h1{margin:0 0 10px}#finalScore{font-size:58px;font-weight:1000;color:#e83259}#notice{position:absolute;z-index:8;top:23%;left:10%;right:10%;text-align:center;font-weight:1000;font-size:clamp(22px,5vw,32px);color:#ef3b64;text-shadow:2px 2px white;pointer-events:none}#notice.bossNotice{top:112px;font-size:19px}#toast{font-size:14px;min-height:20px}@media(max-height:620px){#arena{inset:125px 8px 75px}#phase{top:75px}#target.boss{height:75%}#progress{font-size:11px}}@media(min-aspect-ratio:1/1){#poster{object-fit:contain}#arena{inset:120px 8px 65px}#target{width:clamp(110px,28vh,230px);height:clamp(110px,28vh,230px)}#target.boss{height:85%}}
</style></head><body><main id="app"><section id="home"><img id="poster" src="assets/landing.png" alt="Chaotic cat kitchen"><div id="menu"><button id="play" class="primary">PLAY!</button><button id="how" class="secondary">HOW TO PLAY</button></div></section><section id="game" class="hidden"><div id="hud"><div class="pill">SCORE<strong id="score">0</strong></div><div class="pill">TIME<strong id="time">15</strong></div><div id="tools"><button id="sound" aria-label="Toggle sound">🔊</button><button id="pause" aria-label="Pause">Ⅱ</button></div></div><div id="phase">TABBY RUSH</div><div id="notice"></div><div id="arena"><button id="target" aria-label="Tap cat"><img id="cat" alt="Cat"><span id="bubble"></span></button></div><div id="progress"><span id="progressText">PAW-SY COLLECTED 0/6</span><div id="slots"></div></div></section><section id="cinema" class="hidden"><img id="scene" alt="Story scene"><div id="cinemaLabel"></div></section><section id="end" class="hidden"><div class="panel"><h1>MEOW-FEST!</h1><div id="finalScore">0</div><p id="summary"></p><button id="again" class="primary">PLAY AGAIN</button></div></section><section id="help" class="hidden"><div class="panel"><h1>HOW TO PLAY</h1><p>Tap the mischievous tabby for 15 seconds. Smack Boss Cat Nisa for 5 seconds. Then collect all six Paw-sy friends in 10 seconds: tap two tabbies, then tap the Paw-sy friend to collect it. Repeat!</p><button id="closeHelp" class="secondary">GOT IT!</button></div></section><section id="paused" class="hidden"><div class="panel"><h1>PAUSED</h1><button id="resume" class="primary">RESUME</button></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);const ASSETS={"tabby0":"assets/tabby0.png","tabby5":"assets/tabby5.png","cloud":"assets/cloud.png","tiger":"assets/tiger.png","mango":"assets/mango.png","shadow":"assets/shadow.png","snowball":"assets/snowball.png","oreo":"assets/oreo.png","tabby1":"assets/tabby1.png","return":"assets/return.png","tabby3":"assets/tabby3.png","boss":"assets/boss.png","defeat":"assets/defeat.png","tabby2":"assets/tabby2.png","tabby4":"assets/tabby4.png","landing":"assets/landing.png"};const asset=n=>ASSETS[n];const tabbies=Array.from({length:6},(_,i)=>asset('tabby'+i));const friends=['snowball','shadow','oreo','mango','tiger','cloud'].map(asset);const scenes={defeat:asset('defeat'),return:asset('return')};let phase='menu',score=0,remaining=15,deadline=0,paused=false,raf=0,sceneTimeout=0,sceneRemaining=0,sceneStarted=0,pawHits=0,friendCount=0,awaitingFriend=false,tabbyIndex=0,audioOn=true,lastHit=0,token=0;const AUDIO={"meow":"assets/meow.wav","smack":"assets/smack.wav"};const sounds=['smack','meow'].map(n=>{const a=new Audio(AUDIO[n]);a.preload='auto';return a});const show=(id,on)=>$(id).classList.toggle('hidden',!on);function sound(){if(!audioOn)return;for(let i=0;i<2;i++){const a=sounds[i].cloneNode();a.volume=i?.38:.6;try{a.play().catch(()=>{})}catch(e){}}}function image(src){$('cat').src=src}function move(center=false){const target=$('target');if(center||phase==='boss'){target.style.left='50%';target.style.top='50%';return}const arena=$('arena'),w=arena.clientWidth,h=arena.clientHeight,tw=target.offsetWidth,th=target.offsetHeight;const x=tw/2+Math.random()*Math.max(0,w-tw),y=th/2+Math.random()*Math.max(0,h-th);target.style.left=x+'px';target.style.top=y+'px'}function nextTabby(){tabbyIndex=(tabbyIndex+1)%6;image(tabbies[tabbyIndex]);move()}function reset(){clearTimeout(sceneTimeout);cancelAnimationFrame(raf);token++;score=0;pawHits=0;friendCount=0;awaitingFriend=false;tabbyIndex=0;lastHit=0;paused=false;$('score').textContent='0';$('progressText').textContent='PAW-SY COLLECTED 0/6';$('slots').innerHTML=Array.from({length:6},()=>'<div class="slot"></div>').join('');$('bubble').textContent='';$('notice').textContent='';$('notice').className='';$('target').className='';$('target').setAttribute('aria-label','Tap cat');show('home',false);show('end',false);show('cinema',false);show('paused',false);show('game',true)}function begin(p,duration){phase=p;remaining=duration;deadline=performance.now()+duration*1000;$('phase').textContent=p==='tabby'?'TABBY RUSH':p==='boss'?'BOSS CAT':'PAW-SY COLLECTION';$('target').classList.toggle('boss',p==='boss');$('time').textContent=duration;$('bubble').textContent='';$('notice').textContent='';$('notice').className='';if(p==='boss'){image(asset('boss'));move(true)}else{awaitingFriend=false;image(tabbies[tabbyIndex]);move(true)}cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function tick(now){if(paused)return;remaining=Math.max(0,(deadline-now)/1000);$('time').textContent=Math.ceil(remaining);if(remaining<=0){if(phase==='tabby')begin('boss',5);else if(phase==='boss')cinema('defeat');else if(phase==='paw')finish();return}raf=requestAnimationFrame(tick)}function cinema(which){cancelAnimationFrame(raf);phase=which;show('game',false);show('cinema',true);$('scene').src=scenes[which];$('cinemaLabel').textContent=which==='defeat'?'POOR NISA!':'OH NO! THE CAT HAS BROUGHT ITS PAW-SY!!';const t=++token;sceneTimeout=setTimeout(()=>{if(t!==token)return;if(which==='defeat')cinema('return');else{show('cinema',false);show('game',true);begin('paw',10)}},which==='defeat'?2100:2500)}function finish(){phase='end';cancelAnimationFrame(raf);show('game',false);show('end',true);$('finalScore').textContent=score;$('summary').textContent='Paw-sy collected: '+friendCount+'/6'}function hit(e){if(!['tabby','boss','paw'].includes(phase)||paused||remaining<=0)return;e.preventDefault();const now=performance.now();if(now-lastHit<55)return;lastHit=now;score++;$('score').textContent=score;sound();const target=$('target');target.classList.remove('hit');void target.offsetWidth;target.classList.add('hit');if(phase==='boss'){$('bubble').textContent='';if(score%7===0){$('notice').textContent='WHAT THE FLUFF?!';$('notice').className='bossNotice';setTimeout(()=>{if(phase==='boss')$('notice').textContent=''},600)}}else if(phase==='paw'){
if(awaitingFriend){
 const i=friendCount;
 if(i<6){$('slots').children[i].innerHTML='<img src="'+friends[i]+'" alt="'+['Snowball','Shadow','Oreo','Mango','Tiger','Cloud'][i]+'">';friendCount++;$('progressText').textContent='PAW-SY COLLECTED '+friendCount+'/6';$('bubble').textContent='COLLECTED!';}
 awaitingFriend=false;pawHits=0;
 if(friendCount===6){$('notice').textContent='ALL SIX! CLAW-SOME!';$('target').classList.add('hidden')}else{nextTabby();$('bubble').textContent=''}
}else{
 pawHits++;
 if(pawHits===2 && friendCount<6){awaitingFriend=true;image(friends[friendCount]);move(true);$('bubble').textContent='TAP TO COLLECT!';$('target').setAttribute('aria-label','Collect '+['Snowball','Shadow','Oreo','Mango','Tiger','Cloud'][friendCount]);}
 else{nextTabby();$('bubble').textContent='';}
}
}else{nextTabby();if(score%9===0)$('bubble').textContent='PURR-FECT!';else $('bubble').textContent=''}}function start(){reset();begin('tabby',15)}function pause(){if(!['tabby','boss','paw'].includes(phase))return;if(!paused){paused=true;remaining=Math.max(0,(deadline-performance.now())/1000);cancelAnimationFrame(raf);show('paused',true)}else{paused=false;deadline=performance.now()+remaining*1000;show('paused',false);raf=requestAnimationFrame(tick)}}$('target').addEventListener('pointerdown',hit);$('play').onclick=start;$('again').onclick=start;$('how').onclick=()=>show('help',true);$('closeHelp').onclick=()=>show('help',false);$('sound').onclick=()=>{audioOn=!audioOn;$('sound').textContent=audioOn?'🔊':'🔇'};$('pause').onclick=pause;$('resume').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&['tabby','boss','paw'].includes(phase))pause()});for(const src of [...tabbies,...friends,asset('boss'),...Object.values(scenes),asset('landing')]){const im=new Image();im.src=src}window.__smackQA=()=>({phase,score,remaining,pawHits,friendCount,awaitingFriend});})();</script></body></html>
